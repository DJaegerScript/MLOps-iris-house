name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests-and-lint:
    name: Tests and Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned project and development dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-training.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check .

  docker-build:
    name: Build application image
    runs-on: ubuntu-latest
    needs: tests-and-lint
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application-only image
        run: docker build --pull --file Dockerfile --tag iris-mlops:pr-${{ github.sha }} .

      - name: Run health-only Docker smoke test
        run: python scripts/docker_smoke_test.py --image iris-mlops:pr-${{ github.sha }} --no-build --host-port 8510
