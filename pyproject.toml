[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-mlops"
version = "0.1.0"
description = "Safe scaffolding for an Iris MLOps application"
requires-python = ">=3.11"
dependencies = [
    "boto3==1.43.98",
    "joblib==1.5.3",
    "numpy==2.3.3",
    "scipy==1.17.1",
    "scikit-learn==1.8.0",
    "threadpoolctl==3.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["iris_mlops"]
